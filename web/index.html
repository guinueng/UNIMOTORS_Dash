<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNIMOTORS</title>
<style>
  :root{
    --bg:#0b0d10; --txt:#e6ebf2; --dim:#7c8798; --dimmer:#4a5364; --cyan:#4de0d4;
    --line:#222a36;
    --mono:"SFMono-Regular",ui-monospace,"Roboto Mono",Menlo,monospace;
    --sans:-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);font-family:var(--sans);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:32px;-webkit-font-smoothing:antialiased}
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
  /* 로고 자리 — 나중에 아래 <img> 주석을 풀고 파일명만 넣으세요.
     로고 파일을 index.html 과 같은 폴더(/var/www/unimotors/)에 두면 됩니다. */
  .logo-slot{width:110px;height:110px;border-radius:20px;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--dimmer);
    font-family:var(--mono);font-size:11px;letter-spacing:.1em}
  .logo-slot img{max-width:100%;max-height:100%;display:block}
  .name{font-weight:800;letter-spacing:.24em;font-size:clamp(30px,7vw,52px)}
  .name b{color:var(--cyan)}
  .sub{font-family:var(--mono);font-size:12px;letter-spacing:.28em;color:var(--dim);
    text-transform:uppercase}
  footer{padding-bottom:12px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .enter{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--bg);
    background:var(--cyan);padding:13px 28px;border-radius:8px;font-weight:600;
    transition:transform .15s,box-shadow .15s}
  .enter:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(77,224,212,.22)}
  .enter .d{width:7px;height:7px;border-radius:50%;background:var(--bg);opacity:.55}
  a{text-decoration:none}
  .cr{font-family:var(--mono);font-size:11px;color:var(--dimmer);letter-spacing:.1em}
</style>
</head>
<body>
  <div class="center">
    <div class="logo-slot">
      <!-- 로고 넣기: 아래 주석을 풀고 파일명만 바꾸세요 (예: unist.svg / logo.png)
      <img src="logo.png" alt="UNIMOTORS">
      -->
      LOGO
    </div>
    <div class="name"><b>UNIMOTORS</b></div>
    <div class="sub">UNIST Electric Racing</div>
  </div>
  <footer>
    <a class="enter" href="/app/"><span class="d"></span>팀 데이터 접속</a>
    <div class="cr">© 2026 UNIMOTORS</div>
  </footer>
</body>
</html>
